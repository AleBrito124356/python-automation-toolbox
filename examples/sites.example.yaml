# Config for scripts/14_uptime_checker.py
# Copy this file, edit the sites, then run:
#   python scripts/14_uptime_checker.py sites.yaml

# Optional: JSON POST target for failure alerts (Slack/Discord incoming webhook).
# The UPTIME_WEBHOOK_URL environment variable takes precedence over this value.
webhook_url: ""

sites:
  - name: Personal site
    url: https://example.com
    expect_status: 200

  - name: API health
    url: https://example.com/api/health
    expect_status: 200

  - name: Old blog redirect
    url: https://example.org
    expect_status: 200
