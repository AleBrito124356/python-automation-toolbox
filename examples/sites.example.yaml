# Config for scripts/14_uptime_checker.py
# Copy this file, edit the sites, then run:
#   python scripts/14_uptime_checker.py sites.yaml
#
# The checker remembers each site's last state in sites.state.json (next to
# this file, or wherever --state points), so alerts fire only when a site
# goes DOWN/SLOW and once more when it RECOVERS -- from cron or --loop alike.

# Optional: JSON POST target for alerts (Slack/Discord incoming webhook, or
# your own endpoint). The UPTIME_WEBHOOK_URL environment variable takes
# precedence over this value. A non-2xx answer counts as a failed delivery.
webhook_url: ""

sites:
  # Minimal entry: DOWN unless it answers HTTP 200.
  - name: Personal site
    url: https://example.com
    expect_status: 200

  # Content check: a 200 with an error page inside is still DOWN.
  - name: API health
    url: https://example.com/api/health
    expect_status: 200
    expect_text: '"status":"ok"'

  # Latency budget: a correct answer slower than 1.5 s is reported as SLOW.
  - name: Shop checkout
    url: https://example.org/checkout
    expect_status: [200, 302]
    max_latency_ms: 1500
